<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>E and J Get Ripped</title>
    <style>
        :root {
            --bg-dark: #0f172a;
            --bg-card: #1e293b;
            --bg-card-alt: #334155;
            --primary: #0284c7;
            --primary-hover: #0369a1;
            --accent: #38bdf8;
            --text-light: #f8fafc;
            --text-muted: #94a3b8;
            --border: #475569;
            --success: #22c55e;
            --danger: #ef4444;
            --warning: #f59e0b;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-light);
            margin: 0;
            padding: 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .container {
            width: 100%;
            max-width: 650px;
        }

        header {
            text-align: center;
            margin-bottom: 20px;
            border-bottom: 1px solid var(--border);
            padding-bottom: 15px;
        }

        h1 {
            margin: 0;
            font-size: 1.8rem;
            color: var(--accent);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .sub-header {
            color: var(--text-muted);
            font-size: 0.9rem;
            margin-top: 5px;
        }

        .nav-controls {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 20px;
        }

        select {
            background-color: var(--bg-card);
            color: var(--text-light);
            border: 1px solid var(--border);
            padding: 10px;
            border-radius: 8px;
            font-size: 0.95rem;
            width: 100%;
            outline: none;
        }

        .section-banner {
            background-color: var(--primary);
            color: #ffffff;
            padding: 10px;
            border-radius: 8px;
            font-weight: bold;
            font-size: 1.1rem;
            margin-bottom: 15px;
            text-align: center;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .routine-box {
            background-color: var(--bg-card-alt);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 12px 16px;
            margin-bottom: 15px;
        }

        .routine-title {
            font-weight: bold;
            font-size: 0.95rem;
            color: var(--warning);
            margin-bottom: 6px;
            display: flex;
            align-items: center;
            gap: 6px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .routine-list {
            margin: 0;
            padding-left: 18px;
            font-size: 0.85rem;
            color: var(--text-light);
            line-height: 1.5;
        }

        .card {
            background-color: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 14px;
            margin-bottom: 12px;
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 6px;
        }

        .ex-title {
            font-size: 1.05rem;
            font-weight: 600;
            color: #ffffff;
        }

        .ex-cat {
            font-size: 0.75rem;
            background: var(--bg-card-alt);
            color: var(--accent);
            padding: 2px 6px;
            border-radius: 4px;
            text-transform: uppercase;
        }

        .target-tag {
            font-size: 0.85rem;
            color: var(--accent);
            font-weight: 500;
            margin-bottom: 6px;
        }

        .instructions {
            font-size: 0.85rem;
            color: var(--text-muted);
            line-height: 1.35;
            margin-bottom: 12px;
        }

        .log-grid {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr auto;
            gap: 8px;
            align-items: end;
            background: rgba(15, 23, 42, 0.5);
            padding: 10px;
            border-radius: 8px;
            border: 1px solid var(--bg-card-alt);
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .input-group label {
            font-size: 0.7rem;
            color: var(--text-muted);
            text-transform: uppercase;
            font-weight: 600;
            letter-spacing: 0.5px;
        }

        .input-group input {
            background: var(--bg-dark);
            border: 1px solid var(--border);
            color: var(--text-light);
            padding: 8px 6px;
            border-radius: 6px;
            font-size: 0.85rem;
            width: 100%;
            box-sizing: border-box;
            text-align: center;
        }

        .input-group input:focus {
            border-color: var(--accent);
            outline: none;
        }

        .btn {
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 8px 14px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.85rem;
            display: inline-flex;
            align-items: center;
            gap: 4px;
        }

        .btn:hover {
            background-color: var(--primary-hover);
        }

        .btn-save {
            height: 35px;
            padding: 0 14px;
        }

        .btn-demo {
            background-color: #334155;
            color: var(--accent);
            border: 1px solid #475569;
            padding: 4px 8px;
            border-radius: 6px;
            font-size: 0.8rem;
            cursor: pointer;
        }

        .btn-demo:hover {
            background-color: #475569;
            color: #ffffff;
        }

        .btn-complete {
            width: 100%;
            padding: 12px;
            background-color: var(--success);
            font-size: 1rem;
            margin-top: 15px;
            justify-content: center;
        }

        .btn-undo {
            background-color: var(--danger);
        }

        .modal-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.85);
            z-index: 1000;
            justify-content: center;
            align-items: center;
            backdrop-filter: blur(4px);
        }

        .modal-overlay.active {
            display: flex;
        }

        .modal-content {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 12px;
            width: 90%;
            max-width: 500px;
            overflow: hidden;
            box-shadow: 0 8px 32px rgba(0,0,0,0.5);
        }

        .modal-header {
            padding: 12px 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border);
        }

        .close-btn {
            background: none;
            border: none;
            color: var(--text-muted);
            font-size: 1.5rem;
            cursor: pointer;
        }

        .video-container {
            position: relative;
            padding-bottom: 56.25%;
            height: 0;
            background: #000;
        }

        .video-container iframe {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            border: 0;
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>E and J Get Ripped</h1>
        <div class="sub-header">Technogym & Precor FTS Suite Program</div>
    </header>

    <div class="nav-controls">

            <option value="w2">Week 2: Free-Weight Focus</option>
            <option value="w3">Week 3: Cable Athleticism</option>
            <option value="w4">Week 4: Metabolic Intensity</option>
        </select>

        <select id="sessionSelect" onchange="loadSession()">

            <option value="sB">Session B: Pull / Arms</option>
            <option value="sC">Session C: Step Squat / Legs</option>
        </select>
    </div>

    <!-- Main Content Area -->
    <div id="exerciseList"></div>

    <!-- Session Completion Button -->
    <button class="btn btn-complete" id="completeBtn" onclick="toggleSessionComplete()">
        ✅ Mark Session Complete
    </button>
</div>

<!-- Video Demo Modal -->
<div id="demoModal" class="modal-overlay">

        </div>
    </div>
</div>

    function loadSession() {
        const week = document.getElementById('weekSelect').value;
        const session = document.getElementById('sessionSelect').value;
        const currentData = programData[week][session];

        let html = `<div class="section-banner">${currentData.title}</div>`;

        // Warmup Section
        html += `
            <div class="routine-box">
                <div class="routine-title">🔥 Dynamic Warm-Up & Mobility</div>
                <ul class="routine-list">
                    ${warmups.map(item => `<li>${item}</li>`).join('')}
                </ul>
            </div>
        `;

        // Exercise List
        currentData.exercises.forEach(ex => {
            const savedWt = localStorage.getItem('log_wt_' + ex.id) || '';
            const savedReps = localStorage.getItem('log_reps_' + ex.id) || '';
            const savedLvl = localStorage.getItem('log_lvl_' + ex.id) || '';

            html += `
                <div class="card">
                    <div class="card-header">
                        <span class="ex-title">${ex.name}</span>
                        <div style="display: flex; gap: 6px; align-items: center;">
                            <span class="ex-cat">${ex.cat}</span>
                            <button class="btn-demo" onclick="openDemo('${ex.name}', '${ex.videoId}')">🎥 Demo</button>
                        </div>
                    </div>
                    <div class="target-tag">${ex.target}</div>
                    <div class="instructions">${ex.instructions}</div>
                    <div class="log-grid">
                        <div class="input-group">
                            <label>Weight</label>
                            <input type="text" id="input_wt_${ex.id}" placeholder="e.g. 45 lbs" value="${savedWt}">
                        </div>
                        <div class="input-group">
                            <label>Reps</label>
                            <input type="text" id="input_reps_${ex.id}" placeholder="e.g. 10,10,12" value="${savedReps}">
                        </div>
                        <div class="input-group">
                            <label>Level / Pin</label>
                            <input type="text" id="input_lvl_${ex.id}" placeholder="e.g. Lvl 5" value="${savedLvl}">
                        </div>
                        <button class="btn btn-save" onclick="saveLog('${ex.id}')">Save</button>
                    </div>
                </div>
            `;
        });

        // Cooldown Section
        html += `
            <div class="routine-box">
                <div class="routine-title">🧘 Cool-Down & Flexibility Stretches</div>
                <ul class="routine-list">
                    ${cooldowns.map(item => `<li>${item}</li>`).join('')}
                </ul>
            </div>
        `;

        document.getElementById('exerciseList').innerHTML = html;

        const isComplete = localStorage.getItem('complete_' + week + '_' + session) === 'true';
        updateCompleteButton(isComplete);
    }

    function saveLog(exId) {
        const wt = document.getElementById('input_wt_' + exId).value;
        const reps = document.getElementById('input_reps_' + exId).value;
        const lvl = document.getElementById('input_lvl_' + exId).value;

        localStorage.setItem('log_wt_' + exId, wt);
        localStorage.setItem('log_reps_' + exId, reps);
        localStorage.setItem('log_lvl_' + exId, lvl);

        alert('Progress saved!');
    }

    function toggleSessionComplete() {
        const week = document.getElementById('weekSelect').value;
        const session = document.getElementById('sessionSelect').value;
        const key = 'complete_' + week + '_' + session;
        
        const currentState = localStorage.getItem(key) === 'true';
        localStorage.setItem(key, !currentState);
        
        updateCompleteButton(!currentState);
    }

    function updateCompleteButton(isComplete) {
        const btn = document.getElementById('completeBtn');
        if (isComplete) {
            btn.innerHTML = '↩️ Undo Session Completion';
            btn.className = 'btn btn-complete btn-undo';
        } else {
            btn.innerHTML = '✅ Mark Session Complete';
            btn.className = 'btn btn-complete';
        }
    }

    function openDemo(exName, videoId) {
        document.getElementById('modalExerciseTitle').innerText = exName;
        document.getElementById('demoVideoIframe').src = `https://www.youtube-nocookie.com/embed/${videoId}?autoplay=1&rel=0`;
        document.getElementById('demoModal').classList.add('active');
    }

    function closeDemo() {
        document.getElementById('demoModal').classList.remove('active');
        document.getElementById('demoVideoIframe').src = '';
    }

    document.getElementById('demoModal').addEventListener('click', function(e) {
        if (e.target === this) closeDemo();
    });

    loadSession();
</script>
</body>
</html>
