<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>E and J Get Ripped</title>
    <style>
        :root {
            --bg-dark: #0f172a;
            --bg-card: #1e293b;
            --bg-card-alt: #334155;
            --primary: #0284c7;
            --primary-hover: #0369a1;
            --accent: #38bdf8;
            --text-light: #f8fafc;
            --text-muted: #94a3b8;
            --border: #475569;
            --success: #22c55e;
            --danger: #ef4444;
            --warning: #f59e0b;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-light);
            margin: 0;
            padding: 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .container {
            width: 100%;
            max-width: 650px;
        }

        header {
            text-align: center;
            margin-bottom: 20px;
            border-bottom: 1px solid var(--border);
            padding-bottom: 15px;
        }

        h1 {
            margin: 0;
            font-size: 1.8rem;
            color: var(--accent);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .sub-header {
            color: var(--text-muted);
            font-size: 0.9rem;
            margin-top: 5px;
            margin-bottom: 10px;
        }

        .counter-banner {
            background: linear-gradient(135deg, #0284c7 0%, #0369a1 100%);
            color: #ffffff;
            font-weight: 700;
            font-size: 1.05rem;
            padding: 8px 14px;
            border-radius: 20px;
            display: inline-block;
            margin-bottom: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.3);
        }

        .header-btn-group {
            display: flex;
            gap: 8px;
            justify-content: center;
            flex-wrap: wrap;
            margin-top: 8px;
        }

        .nav-controls {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 8px;
            margin-bottom: 20px;
        }

        select {
            background-color: var(--bg-card);
            color: var(--text-light);
            border: 1px solid var(--border);
            padding: 10px 6px;
            border-radius: 8px;
            font-size: 0.85rem;
            width: 100%;
            outline: none;
        }

        .section-banner {
            background-color: var(--primary);
            color: #ffffff;
            padding: 10px;
            border-radius: 8px;
            font-weight: bold;
            font-size: 1.05rem;
            margin-bottom: 15px;
            text-align: center;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .routine-box {
            background-color: var(--bg-card-alt);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 12px 16px;
            margin-bottom: 15px;
        }

        .routine-title {
            font-weight: bold;
            font-size: 0.95rem;
            color: var(--warning);
            margin-bottom: 6px;
            display: flex;
            align-items: center;
            gap: 6px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .routine-list {
            margin: 0;
            padding-left: 18px;
            font-size: 0.85rem;
            color: var(--text-light);
            line-height: 1.5;
        }

        .card {
            background-color: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 14px;
            margin-bottom: 12px;
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 6px;
        }

        .ex-title {
            font-size: 1.05rem;
            font-weight: 600;
            color: #ffffff;
        }

        .ex-cat {
            font-size: 0.75rem;
            background: var(--bg-card-alt);
            color: var(--accent);
            padding: 2px 6px;
            border-radius: 4px;
            text-transform: uppercase;
        }

        .target-tag {
            font-size: 0.85rem;
            color: var(--accent);
            font-weight: 500;
            margin-bottom: 6px;
        }

        .instructions {
            font-size: 0.85rem;
            color: var(--text-muted);
            line-height: 1.35;
            margin-bottom: 12px;
        }

        .log-grid {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr auto;
            gap: 8px;
            align-items: end;
            background: rgba(15, 23, 42, 0.5);
            padding: 10px;
            border-radius: 8px;
            border: 1px solid var(--bg-card-alt);
        }

        .action-buttons {
            display: flex;
            gap: 4px;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .input-group label {
            font-size: 0.7rem;
            color: var(--text-muted);
            text-transform: uppercase;
            font-weight: 600;
            letter-spacing: 0.5px;
        }

        .input-group input {
            background: var(--bg-dark);
            border: 1px solid var(--border);
            color: var(--text-light);
            padding: 8px 6px;
            border-radius: 6px;
            font-size: 0.85rem;
            width: 100%;
            box-sizing: border-box;
            text-align: center;
        }

        .input-group input:focus {
            border-color: var(--accent);
            outline: none;
        }

        .latest-log-badge {
            margin-top: 8px;
            font-size: 0.75rem;
            color: var(--warning);
            font-style: italic;
        }

        .btn {
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 8px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.85rem;
            display: inline-flex;
            align-items: center;
            gap: 4px;
        }

        .btn:hover { background-color: var(--primary-hover); }

        .btn-subtle {
            background-color: var(--bg-card-alt);
            color: var(--accent);
            border: 1px solid var(--border);
            padding: 6px 10px;
            border-radius: 6px;
            font-size: 0.8rem;
            cursor: pointer;
        }

        .btn-subtle:hover {
            background-color: var(--border);
            color: #ffffff;
        }

        .btn-save { height: 35px; }

        .btn-clear {
            background-color: #334155;
            color: #cbd5e1;
            height: 35px;
        }

        .btn-clear:hover {
            background-color: var(--danger);
            color: #ffffff;
        }

        .btn-row-del {
            background-color: transparent;
            color: var(--text-muted);
            border: none;
            cursor: pointer;
            padding: 2px 6px;
            font-size: 0.85rem;
            border-radius: 4px;
        }

        .btn-row-del:hover {
            color: var(--danger);
            background-color: rgba(239, 68, 68, 0.1);
        }

        .btn-demo {
            background-color: #334155;
            color: var(--accent);
            border: 1px solid #475569;
            padding: 4px 8px;
            border-radius: 6px;
            font-size: 0.8rem;
            cursor: pointer;
            text-decoration: none;
        }

        .btn-demo:hover {
            background-color: #475569;
            color: #ffffff;
        }

        .btn-complete {
            width: 100%;
            padding: 12px;
            background-color: var(--success);
            font-size: 1rem;
            margin-top: 15px;
            justify-content: center;
        }

        .btn-undo { background-color: var(--danger); }

        .history-container {
            display: none;
            background-color: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 16px;
            margin-bottom: 20px;
            width: 100%;
            box-sizing: border-box;
        }

        .history-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
            border-bottom: 1px solid var(--border);
            padding-bottom: 8px;
        }

        .history-title {
            font-weight: bold;
            color: var(--accent);
            font-size: 1.1rem;
        }

        .session-group-card {
            background-color: var(--bg-dark);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 12px;
            margin-bottom: 14px;
        }

        .session-group-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--bg-card-alt);
            padding-bottom: 6px;
            margin-bottom: 8px;
        }

        .session-group-title {
            font-weight: 700;
            color: var(--warning);
            font-size: 0.95rem;
        }

        .session-group-date {
            font-size: 0.75rem;
            color: var(--text-muted);
        }

        .session-item-row {
            display: grid;
            grid-template-columns: 2fr 1fr 1fr 1fr auto;
            gap: 6px;
            align-items: center;
            padding: 6px 0;
            border-bottom: 1px dashed var(--bg-card-alt);
            font-size: 0.85rem;
        }

        .session-item-row:last-child {
            border-bottom: none;
        }

        .empty-history {
            color: var(--text-muted);
            font-style: italic;
            text-align: center;
            padding: 12px 0;
            font-size: 0.9rem;
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>E and J Get Ripped</h1>
        <div class="sub-header">Technogym & Precor FTS Suite Program</div>
        <div class="counter-banner" id="workoutCounter">You have completed 33 workouts so far!</div>
        
        <div class="header-btn-group">
            <button class="btn-subtle" onclick="toggleHistoryView()">📊 History</button>
            <button class="btn-subtle" onclick="exportData()">📥 Export Logs</button>
            <button class="btn-subtle" onclick="triggerImport()">📤 Import Logs</button>
            <input type="file" id="importInput" style="display: none;" accept=".json" onchange="importData(event)">
        </div>
    </header>

    <div id="historyContainer" class="history-container">
        <div class="history-header">
            <span class="history-title">Workout History by Session</span>
            <button class="btn btn-clear" onclick="clearAllHistory()" style="height: auto; padding: 4px 8px; font-size: 0.75rem;">Clear All History</button>
        </div>
        <div id="historyContent"></div>
    </div>

    <div class="nav-controls">
        <select id="monthSelect" onchange="loadSession()">
            <option value="m1">Jan: Foundation</option>
            <option value="m2">Feb: Hypertrophy</option>
            <option value="m3">Mar: Cable Athleticism</option>
            <option value="m4">Apr: Metabolic Burn</option>
            <option value="m5">May: Power & Strength</option>
            <option value="m6">Jun: Summer Shred</option>
            <option value="m7">Jul: Heavy Compounds</option>
            <option value="m8">Aug: Time-Under-Tension</option>
            <option value="m9">Sep: Posture & Balance</option>
            <option value="m10">Oct: Endurance</option>
            <option value="m11">Nov: Volume Peak</option>
            <option value="m12">Dec: Year-End Finish</option>
        </select>

        <select id="weekSelect" onchange="loadSession()">
            <option value="w1">Week 1</option>
            <option value="w2">Week 2</option>
            <option value="w3">Week 3</option>
            <option value="w4">Week 4</option>
            <option value="w5">Deload / Flex Week</option>
        </select>

        <select id="sessionSelect" onchange="loadSession()">
            <option value="sA">Session A: Push</option>
            <option value="sB">Session B: Pull</option>
            <option value="sC">Session C: Legs</option>
        </select>
    </div>

    <div id="exerciseList"></div>

    <button class="btn btn-complete" id="completeBtn" onclick="toggleSessionComplete()">
        ✅ Mark Session Complete
    </button>
</div>

<script>
    if (!localStorage.getItem('lifetime_workout_count')) {
        localStorage.setItem('lifetime_workout_count', '33');
    }

    function updateCounterDisplay() {
        const count = parseInt(localStorage.getItem('lifetime_workout_count') || '33', 10);
        document.getElementById('workoutCounter').innerText = `You have completed ${count} workouts so far!`;
    }

    const monthNames = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];

    function createSessionData(mNum, wNum, sType) {
        const mLabel = monthNames[mNum - 1];
        const prefix = `m${mNum}w${wNum}${sType.toLowerCase()}`;
        const altPrefix = `w${wNum}${sType.toLowerCase()}`;
        const sessionName = sType === 'sA' ? 'Push' : sType === 'sB' ? 'Pull' : 'Legs';

        if (wNum === 5) {
            if (sType === 'sA') {
                return {
                    sessionTag: `${mLabel} - Week 5 - Deload Upper Mobility`,
                    title: `${mLabel} - Deload Week: Active Mobility & Cable Flow (Upper)`,
                    warmups: [
                        "15 mins treadmill walk (3-5% incline) or stationary bike",
                        "Scapular circles & shoulder dislocations (10 reps)",
                        "Cat-Cow & thoracic rotations (10 reps)"
                    ],
                    cooldowns: [
                        "Scapular wall slides (10 reps)",
                        "Doorway chest & shoulder stretch (45s per side)",
                        "Thoracic spine foam rolling (2 mins)"
                    ],
                    exercises: [
                        { id: `${prefix}1`, legacyId: `${altPrefix}1`, name: "Precor FTS Face Pull to External Rotation", cat: "Precor FTS", target: "3 sets x 12-15 (Light)", instructions: "Focus purely on scapular control and posterior shoulder engagement." },
                        { id: `${prefix}2`, legacyId: `${altPrefix}2`, name: "Technogym Chest Press / Incline Fly", cat: "Technogym", target: "3 sets x 12-15 (Light)", instructions: "Use ~40-50% 1RM with a controlled 3-second eccentric lower." },
                        { id: `${prefix}3`, legacyId: `${altPrefix}3`, name: "Light Dumbbell Overhead Press / Y-T-W", cat: "Free Weights", target: "3 sets x 12-15", instructions: "Smooth motion to prime shoulder stability without pushing near fatigue." },
                        { id: `${prefix}4`, legacyId: `${altPrefix}4`, name: "Precor FTS Pallof Press", cat: "Core", target: "3 sets x 10 holds / side", instructions: "Press cable handle straight out and hold for 2s to engage anti-rotational core." }
                    ]
                };
            } else if (sType === 'sB') {
                return {
                    sessionTag: `${mLabel} - Week 5 - Deload Lower Mobility`,
                    title: `${mLabel} - Deload Week: Lower Body Mobility & Hips`,
                    warmups: [
                        "15 mins rowing machine or elliptical (moderate pace)",
                        "Leg swings (forward & lateral, 12 reps)",
                        "Hip openers & Cossack shifts (10 reps)"
                    ],
                    cooldowns: [
                        "Seated figure-4 glute stretch (45s per side)",
                        "Kneeling hip flexor & quad stretch (45s per side)",
                        "Calf wall stretch (30s per side)"
                    ],
                    exercises: [
                        { id: `${prefix}1`, legacyId: `${altPrefix}1`, name: "Bodyweight or Goblet Step-Ups", cat: "Free Weights", target: "3 sets x 12 / leg", instructions: "Low box/bench height; drive through front foot focusing on ankle and knee alignment." },
                        { id: `${prefix}2`, legacyId: `${altPrefix}2`, name: "Dumbbell Romanian Deadlift (Stretch Focus)", cat: "Free Weights", target: "3 sets x 12-15 (Light)", instructions: "Very light load, emphasizing deep hip hinge and hamstrings stretch." },
                        { id: `${prefix}3`, legacyId: `${altPrefix}3`, name: "Technogym Leg Extension / Seated Curl", cat: "Technogym", target: "3 sets x 12-15", instructions: "Light weight; pause for 1 full second at peak extension/flexion." },
                        { id: `${prefix}4`, legacyId: `${altPrefix}4`, name: "Side Plank Holds or Bird-Dogs", cat: "Core", target: "3 sets x 30-45s / side", instructions: "Keep torso square and glutes fully engaged throughout." }
                    ]
                };
            } else {
                return {
                    sessionTag: `${mLabel} - Week 5 - Deload Flush & Core`,
                    title: `${mLabel} - Deload Week: Aerobic Flush & Posture`,
                    warmups: [
                        "10 mins steady-state cycle or treadmill walk",
                        "World's Greatest Stretch (5 reps per side)",
                        "Arm & leg dynamic swings (10 reps)"
                    ],
                    cooldowns: [
                        "Child's pose with arm walkouts (60s hold)",
                        "Cobra to Downward Dog transition (5 fluid reps)",
                        "Deep diaphragm breathing hold (2 mins)"
                    ],
                    exercises: [
                        { id: `${prefix}1`, legacyId: `${altPrefix}1`, name: "Moderate Aerobic Flush (Bike/Treadmill)", cat: "Cardio", target: "15-20 mins Zone 2", instructions: "Steady-state moderate effort where you can maintain a conversation easily." },
                        { id: `${prefix}2`, legacyId: `${altPrefix}2`, name: "Precor FTS Cable Woodchoppers", cat: "Precor FTS", target: "3 sets x 12 / side (Light)", instructions: "Fluid rotation across body emphasizing core control." },
                        { id: `${prefix}3`, legacyId: `${altPrefix}3`, name: "Dumbbell Farmer's / Suitcase Carry", cat: "Free Weights", target: "3 sets x 40s carry", instructions: "Maintain upright posture with shoulders drawn down and back." },
                        { id: `${prefix}4`, legacyId: `${altPrefix}4`, name: "Deadbugs or Hanging Leg/Knee Raises", cat: "Core", target: "3 sets x 12 controlled reps", instructions: "Focus on lower abdominal activation and keeping lower back flat." }
                    ]
                };
            }
        }

        if (sType === 'sA') {
            return {
                sessionTag: `${mLabel} - Week ${wNum} - Session A (${sessionName})`,
                title: `${mLabel} - Week ${wNum} - Session A: Push / Upper`,
                warmups: [
                    "20 mins stationary bike, treadmill, or elliptical",
                    "Arm circles & Controlled Articular Rotations (15 reps)",
                    "Scapular push-ups & wall slides (12 reps)",
                    "Dynamic chest huggers & band openers (10 reps)"
                ],
                cooldowns: [
                    "Doorway / Wall Chest & Anterior Deltoid Stretch (30s per side)",
                    "Overhead Triceps & Lat Stretch (30s per side)",
                    "Child's Pose with Arm Walkouts (45s hold)"
                ],
                exercises: [
                    { id: `${prefix}1`, legacyId: `${altPrefix}1`, name: wNum % 2 === 1 ? "Dumbbell Overhead Press" : "Standing DB Overhead Press", cat: "Free Weights", target: `3 sets x ${12 - wNum}`, instructions: "Press dumbbells straight overhead maintaining steady core bracing." },
                    { id: `${prefix}2`, legacyId: `${altPrefix}2`, name: "Technogym Chest Press", cat: "Technogym", target: `3 sets x ${12 - wNum}`, instructions: "Adjust seat height so handles align with mid-chest; press forward smoothly." },
                    { id: `${prefix}3`, legacyId: `${altPrefix}3`, name: wNum > 2 ? "FTS Cable Overhead Press" : "Overhead Triceps Extension", cat: wNum > 2 ? "Precor FTS" : "Free Weights", target: "3 sets x 12-15", instructions: "Control the weight through a full range of motion." },
                    { id: `${prefix}4`, legacyId: `${altPrefix}4`, name: wNum % 2 === 1 ? "Forearm Plank Hold" : "Russian Twists", cat: "Core", target: wNum % 2 === 1 ? `3 sets x ${30 + (wNum * 10)}s` : "3 sets x 20 total twists", instructions: wNum % 2 === 1 ? "Maintain a rigid straight line from shoulders to heels." : "Sit with knees bent, lean torso back slightly, and rotate side-to-side with optional dumbbell weight." }
                ]
            };
        } else if (sType === 'sB') {
            return {
                sessionTag: `${mLabel} - Week ${wNum} - Session B (${sessionName})`,
                title: `${mLabel} - Week ${wNum} - Session B: Pull / Arms`,
                warmups: [
                    "20 mins stationary bike, treadmill, or elliptical",
                    "Cat-Cow & Thoracic Spine Rotations (10 reps)",
                    "Scapular pull-ups / Lat shrugs (12 reps)",
                    "Banded pull-aparts for rear delts (15 reps)"
                ],
                cooldowns: [
                    "Standing Overhead Lat & Side Stretch (30s per side)",
                    "Seated Biceps & Wrist Flexor Stretch (30s per side)",
                    "Cross-Body Rear Delt Stretch (30s per side)"
                ],
                exercises: [
                    { id: `${prefix}1`, legacyId: `${altPrefix}1`, name: wNum % 2 === 1 ? "Technogym High Pull Lat" : "Technogym Low Pull Row", cat: "Technogym", target: `3 sets x ${12 - wNum}`, instructions: "Keep chest tall and pull handles down/back toward torso." },
                    { id: `${prefix}2`, legacyId: `${altPrefix}2`, name: wNum > 2 ? "Single-Arm Dumbbell Row" : "Incline Dumbbell Curl", cat: "Free Weights", target: "3 sets x 10-12", instructions: "Squeeze target muscles at peak contraction." },
                    { id: `${prefix}3`, legacyId: `${altPrefix}3`, name: "Precor FTS Face Pulls", cat: "Precor FTS", target: "3 sets x 15", instructions: "Pull rope high toward forehead, flaring hands past ears." },
                    { id: `${prefix}4`, legacyId: `${altPrefix}4`, name: "Precor FTS Cable Crunch", cat: "Core", target: "3 sets x 12-15", instructions: "Kneel facing pulley and flex abs to bring ribs toward hips." }
                ]
            };
        } else {
            return {
                sessionTag: `${mLabel} - Week ${wNum} - Session C (${sessionName})`,
                title: `${mLabel} - Week ${wNum} - Session C: Step Squat / Legs`,
                warmups: [
                    "20 mins stationary bike, treadmill, or elliptical",
                    "Leg swings (forward & lateral, 12 per leg)",
                    "Bodyweight squats & Cossack shifts (10 total)",
                    "Ankle mobility drives & hip circles (10 per side)"
                ],
                cooldowns: [
                    "Kneeling Hip Flexor & Quad Stretch (30s per side)",
                    "Standing or Seated Hamstring Reach (30s per side)",
                    "Seated Figure-4 Glute Stretch (30s per side)"
                ],
                exercises: [
                    { id: `${prefix}1`, legacyId: `${altPrefix}1`, name: "Dumbbell Step Squat", cat: "Free Weights", target: `3 sets x ${10 + wNum} / leg`, instructions: "Step foot up onto box, drive up into full stand, then squat down controlled." },
                    { id: `${prefix}2`, legacyId: `${altPrefix}2`, name: wNum % 2 === 0 ? "Precor Leg Press" : "Dumbbell Romanian Deadlift", cat: wNum % 2 === 0 ? "Precor" : "Free Weights", target: "3 sets x 10-12", instructions: "Hinge at hips or press through platform driving through heels." },
                    { id: `${prefix}3`, legacyId: `${altPrefix}3`, name: "Precor Leg Press Calf Raises", cat: "Precor", target: "3 sets x 15-20", instructions: "Extend ankles on platform edge to elevate heels." },
                    { id: `${prefix}4`, legacyId: `${altPrefix}4`, name: "Precor FTS Woodchoppers", cat: "Core", target: "3 sets x 12 / side", instructions: "Rotate torso diagonally across body using core power." }
                ]
            };
        }
    }

    const programData = {};
    const exerciseMetaMap = {};

    for (let m = 1; m <= 12; m++) {
        programData['m' + m] = {};
        for (let w = 1; w <= 5; w++) {
            programData['m' + m]['w' + w] = {
                sA: createSessionData(m, w, 'sA'),
                sB: createSessionData(m, w, 'sB'),
                sC: createSessionData(m, w, 'sC')
            };
            ['sA', 'sB', 'sC'].forEach(sKey => {
                const sess = programData['m' + m]['w' + w][sKey];
                sess.exercises.forEach(ex => {
                    exerciseMetaMap[ex.id] = { name: ex.name, sessionTag: sess.sessionTag };
                    if (ex.legacyId) {
                        exerciseMetaMap[ex.legacyId] = { name: ex.name, sessionTag: sess.sessionTag };
                    }
                });
            });
        }
    }

    function autoSelectCurrentMonth() {
        const currentMonthIndex = new Date().getMonth() + 1;
        document.getElementById('monthSelect').value = 'm' + currentMonthIndex;
    }

    function openDemo(exName) {
        const searchQuery = encodeURIComponent(exName + " exercise demonstration form");
        window.open(`https://www.youtube.com/results?search_query=${searchQuery}`, '_blank');
    }

    function getExerciseLogs(exId, legacyId) {
        let logs = [];
        const raw = localStorage.getItem('log_history_' + exId);
        if (raw) {
            try { logs = JSON.parse(raw); } catch(e) {}
        }
        if (logs.length === 0 && legacyId) {
            const legacyRaw = localStorage.getItem('log_history_' + legacyId);
            if (legacyRaw) {
                try { logs = JSON.parse(legacyRaw); } catch(e) {}
            }
        }
        return logs;
    }

    function findLatestLogForExercise(exName) {
        let latestEntry = null;
        let highestId = -1;

        const normalize = (str) => str.toLowerCase().replace(/[^a-z0-9]/g, '');
        const targetClean = normalize(exName);

        for (let i = 0; i < localStorage.length; i++) {
            const key = localStorage.key(i);
            if (key.startsWith('log_history_')) {
                const exId = key.replace('log_history_', '');
                
                let loggedExName = exerciseMetaMap[exId] ? exerciseMetaMap[exId].name : '';
                
                const logs = getExerciseLogs(exId, null);
                logs.forEach(entry => {
                    const entryName = entry.exerciseName || loggedExName;
                    if (entryName && (normalize(entryName).includes(targetClean) || targetClean.includes(normalize(entryName)))) {
                        const entryId = entry.id || 0;
                        if (entryId > highestId) {
                            highestId = entryId;
                            latestEntry = entry;
                        }
                    }
                });
            }
        }
        return latestEntry;
    }

    function saveExerciseLogs(exId, logsArray) {
        localStorage.setItem('log_history_' + exId, JSON.stringify(logsArray));
    }

    function getCurrentSessionTag() {
        const month = document.getElementById('monthSelect').value;
        const week = document.getElementById('weekSelect').value;
        const session = document.getElementById('sessionSelect').value;
        return programData[month][week][session].sessionTag;
    }

    function loadSession() {
        updateCounterDisplay();
        const month = document.getElementById('monthSelect').value;
        const week = document.getElementById('weekSelect').value;
        const session = document.getElementById('sessionSelect').value;
        const currentData = programData[month][week][session];

        let html = `<div class="section-banner">${currentData.title}</div>`;

        html += `
            <div class="routine-box">
                <div class="routine-title">🔥 Dynamic Warm-Up & Mobility</div>
                <ul class="routine-list">
                    ${currentData.warmups.map(item => `<li>${item}</li>`).join('')}
                </ul>
            </div>
        `;

        currentData.exercises.forEach(ex => {
            const logs = getExerciseLogs(ex.id, ex.legacyId);
            let latestLog = logs.length > 0 ? logs[logs.length - 1] : null;

            const globalLatestLog = findLatestLogForExercise(ex.name);

            if (globalLatestLog && (!latestLog || globalLatestLog.id > latestLog.id)) {
                latestLog = globalLatestLog;
            }

            const lastLogText = latestLog 
                ? `Last logged: ${latestLog.timestamp} (${latestLog.weight} | ${latestLog.reps} reps | ${latestLog.level})`
                : `No history logged yet.`;

            // Always prepopulate input boxes with values from the latest log (across all weeks and months)
            let initWt = '';
            let initReps = '';
            let initLvl = '';

            if (latestLog) {
                if (latestLog.weight && latestLog.weight !== '-') initWt = latestLog.weight;
                if (latestLog.reps && latestLog.reps !== '-') initReps = latestLog.reps;
                if (latestLog.level && latestLog.level !== '-') initLvl = latestLog.level;
            }

            html += `
                <div class="card">
                    <div class="card-header">
                        <span class="ex-title">${ex.name}</span>
                        <div style="display: flex; gap: 6px; align-items: center;">
                            <span class="ex-cat">${ex.cat}</span>
                            <button class="btn-demo" onclick="openDemo('${ex.name}')">🎥 Demo</button>
                        </div>
                    </div>
                    <div class="target-tag">${ex.target}</div>
                    <div class="instructions">${ex.instructions}</div>
                    <div class="log-grid">
                        <div class="input-group">
                            <label>Weight</label>
                            <input type="text" id="input_wt_${ex.id}" value="${initWt}" placeholder="e.g. 45 lbs">
                        </div>
                        <div class="input-group">
                            <label>Reps</label>
                            <input type="text" id="input_reps_${ex.id}" value="${initReps}" placeholder="e.g. 10,10,12">
                        </div>
                        <div class="input-group">
                            <label>Level / Pin</label>
                            <input type="text" id="input_lvl_${ex.id}" value="${initLvl}" placeholder="e.g. Lvl 5">
                        </div>
                        <div class="action-buttons">
                            <button class="btn btn-save" onclick="saveLog('${ex.id}', '${ex.legacyId || ''}', '${ex.name.replace(/'/g, "\\'")}')">Save</button>
                            <button class="btn btn-clear" onclick="clearInputs('${ex.id}')" title="Clear inputs">Clear</button>
                        </div>
                    </div>
                    <div class="latest-log-badge" id="badge_${ex.id}">${lastLogText}</div>
                </div>
            `;
        });

        html += `
            <div class="routine-box">
                <div class="routine-title">🧘 Cool-Down & Flexibility Stretches</div>
                <ul class="routine-list">
                    ${currentData.cooldowns.map(item => `<li>${item}</li>`).join('')}
                </ul>
            </div>
        `;

        document.getElementById('exerciseList').innerHTML = html;

        const key = 'complete_' + month + '_' + week + '_' + session;
        const isComplete = localStorage.getItem(key) === 'true';
        updateCompleteButton(isComplete);
    }

    function saveLog(exId, legacyId, exName) {
        const wtInput = document.getElementById('input_wt_' + exId);
        const repsInput = document.getElementById('input_reps_' + exId);
        const lvlInput = document.getElementById('input_lvl_' + exId);

        const wt = wtInput.value.trim();
        const reps = repsInput.value.trim();
        const lvl = lvlInput.value.trim();

        if (!wt && !reps && !lvl) {
            alert("Please enter a weight, rep count, or level before saving!");
            return;
        }

        const now = new Date();
        const timestamp = now.toLocaleDateString('en-US', { 
            month: 'short', 
            day: 'numeric', 
            year: 'numeric' 
        });

        const newEntry = {
            id: Date.now(),
            timestamp: timestamp,
            sessionTag: getCurrentSessionTag(),
            exerciseName: exName,
            weight: wt || '-',
            reps: reps || '-',
            level: lvl || '-'
        };

        const logs = getExerciseLogs(exId, legacyId);
        logs.push(newEntry);
        saveExerciseLogs(exId, logs);

        const badge = document.getElementById('badge_' + exId);
        if (badge) {
            badge.innerText = `Last logged: ${timestamp} (${newEntry.weight} | ${newEntry.reps} reps | ${newEntry.level})`;
        }

        if (document.getElementById('historyContainer').style.display === 'block') {
            renderHistory();
        }
    }

    function clearInputs(exId) {
        document.getElementById('input_wt_' + exId).value = '';
        document.getElementById('input_reps_' + exId).value = '';
        document.getElementById('input_lvl_' + exId).value = '';
    }

    function deleteSingleLogEntry(exId, logId) {
        if (confirm("Delete this log entry?")) {
            let logs = getExerciseLogs(exId, null);
            logs = logs.filter(item => item.id !== logId);
            saveExerciseLogs(exId, logs);
            renderHistory();
            loadSession();
        }
    }

    function toggleSessionComplete() {
        const month = document.getElementById('monthSelect').value;
        const week = document.getElementById('weekSelect').value;
        const session = document.getElementById('sessionSelect').value;
        const key = 'complete_' + month + '_' + week + '_' + session;
        
        const currentState = localStorage.getItem(key) === 'true';
        localStorage.setItem(key, (!currentState).toString());

        let currentCount = parseInt(localStorage.getItem('lifetime_workout_count') || '33', 10);
        if (!currentState) {
            currentCount += 1;
        } else {
            currentCount = Math.max(0, currentCount - 1);
        }
        localStorage.setItem('lifetime_workout_count', currentCount.toString());
        updateCounterDisplay();

        updateCompleteButton(!currentState);
    }

    function updateCompleteButton(isComplete) {
        const btn = document.getElementById('completeBtn');
        if (isComplete) {
            btn.innerHTML = '↩️ Undo Session Completion';
            btn.className = 'btn btn-complete btn-undo';
        } else {
            btn.innerHTML = '✅ Mark Session Complete';
            btn.className = 'btn btn-complete';
        }
    }

    function toggleHistoryView() {
        const histContainer = document.getElementById('historyContainer');
        if (histContainer.style.display === 'block') {
            histContainer.style.display = 'none';
        } else {
            renderHistory();
            histContainer.style.display = 'block';
        }
    }

    function renderHistory() {
        const sessionMap = {};

        for (let i = 0; i < localStorage.length; i++) {
            const key = localStorage.key(i);
            if (key.startsWith('log_history_')) {
                const exId = key.replace('log_history_', '');
                const logs = getExerciseLogs(exId, null);
                const meta = exerciseMetaMap[exId] || { name: exId.toUpperCase(), sessionTag: 'Workout Session' };

                logs.forEach(entry => {
                    const tag = entry.sessionTag || meta.sessionTag;
                    const groupKey = `${tag}___${entry.timestamp}`;

                    if (!sessionMap[groupKey]) {
                        sessionMap[groupKey] = {
                            sessionTag: tag,
                            timestamp: entry.timestamp,
                            items: []
                        };
                    }

                    sessionMap[groupKey].items.push({
                        exId: exId,
                        logId: entry.id || Date.now(),
                        exercise: entry.exerciseName || meta.name,
                        weight: entry.weight || '-',
                        reps: entry.reps || '-',
                        level: entry.level || '-'
                    });
                });
            }
        }

        const historyContent = document.getElementById('historyContent');
        const sortedGroups = Object.values(sessionMap);

        if (sortedGroups.length === 0) {
            historyContent.innerHTML = `<div class="empty-history">No logged workouts found. Import logs or hit "Save" on exercises!</div>`;
            return;
        }

        sortedGroups.sort((a, b) => {
            const idA = a.items[0]?.logId || 0;
            const idB = b.items[0]?.logId || 0;
            return idB - idA;
        });

        let html = '';

        sortedGroups.forEach(group => {
            html += `
                <div class="session-group-card">
                    <div class="session-group-header">
                        <span class="session-group-title">🏋️ ${group.sessionTag}</span>
                        <span class="session-group-date">📅 ${group.timestamp}</span>
                    </div>
            `;

            group.items.forEach(item => {
                html += `
                    <div class="session-item-row">
                        <span><strong>${item.exercise}</strong></span>
                        <span>Wt: ${item.weight}</span>
                        <span>Reps: ${item.reps}</span>
                        <span>Lvl: ${item.level}</span>
                        <button class="btn-row-del" onclick="deleteSingleLogEntry('${item.exId}', ${item.logId})" title="Delete entry">🗑️</button>
                    </div>
                `;
            });

            html += `</div>`;
        });

        historyContent.innerHTML = html;
    }

    function clearAllHistory() {
        if (confirm("Are you sure you want to permanently delete all logged history and reset counter?")) {
            Object.keys(localStorage).forEach(key => {
                if (key.startsWith('log_history_') || key.startsWith('complete_') || key.startsWith('log_wt_') || key.startsWith('log_reps_') || key.startsWith('log_lvl_')) {
                    localStorage.removeItem(key);
                }
            });
            localStorage.setItem('lifetime_workout_count', '33');
            loadSession();
            renderHistory();
        }
    }

    function exportData() {
        let exportObj = {
            lifetime_workout_count: localStorage.getItem('lifetime_workout_count') || '33'
        };
        for (let i = 0; i < localStorage.length; i++) {
            let key = localStorage.key(i);
            if (key.startsWith('log_history_') || key.startsWith('complete_')) {
                exportObj[key] = localStorage.getItem(key);
            }
        }

        let dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(exportObj, null, 2));
        let downloadAnchor = document.createElement('a');
        downloadAnchor.setAttribute("href", dataStr);
        downloadAnchor.setAttribute("download", "workout_history_backup.json");
        document.body.appendChild(downloadAnchor);
        downloadAnchor.click();
        downloadAnchor.remove();
    }

    function triggerImport() {
        document.getElementById('importInput').click();
    }

    function deriveHistoricalDate(code) {
        const match = code.match(/w(\d)s([abc])/i);
        if (!match) return "Historical Log";

        const weekNum = parseInt(match[1], 10);
        const sessType = match[2].toLowerCase();
        
        const baseDate = new Date();
        baseDate.setDate(baseDate.getDate() - (28 - (weekNum - 1) * 7));
        
        if (sessType === 'b') baseDate.setDate(baseDate.getDate() + 2);
        if (sessType === 'c') baseDate.setDate(baseDate.getDate() + 4);

        return baseDate.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
    }

    function importData(event) {
        const fileReader = new FileReader();
        fileReader.onload = function(e) {
            try {
                const importedObj = JSON.parse(e.target.result);
                let importedCount = 0;
                const legacyGroups = {};

                Object.keys(importedObj).forEach(key => {
                    let val = importedObj[key];

                    if (key === 'lifetime_workout_count') {
                        localStorage.setItem(key, typeof val === 'string' ? val : JSON.stringify(val));
                        return;
                    }

                    if (key.startsWith('log_history_')) {
                        let parsedVal = val;
                        if (typeof val === 'string') {
                            try { parsedVal = JSON.parse(val); } catch (e) {}
                        }
                        if (Array.isArray(parsedVal)) {
                            localStorage.setItem(key, JSON.stringify(parsedVal));
                            importedCount += parsedVal.length;
                        }
                        return;
                    }

                    if (key.startsWith('log_wt_') || key.startsWith('log_reps_') || key.startsWith('log_lvl_')) {
                        let fieldType = '';
                        let code = '';

                        if (key.startsWith('log_wt_')) {
                            fieldType = 'weight';
                            code = key.replace('log_wt_', '');
                        } else if (key.startsWith('log_reps_')) {
                            fieldType = 'reps';
                            code = key.replace('log_reps_', '');
                        } else if (key.startsWith('log_lvl_')) {
                            fieldType = 'level';
                            code = key.replace('log_lvl_', '');
                        }

                        if (!legacyGroups[code]) {
                            legacyGroups[code] = { weight: '-', reps: '-', level: '-' };
                        }
                        legacyGroups[code][fieldType] = val && val.trim() !== '' ? val : '-';
                    }
                });

                Object.keys(legacyGroups).forEach((code, index) => {
                    const group = legacyGroups[code];
                    if (group.weight !== '-' || group.reps !== '-' || group.level !== '-') {
                        const targetKey = code.startsWith('m') ? code : 'm1' + code;
                        const derivedDate = deriveHistoricalDate(code);
                        const meta = exerciseMetaMap[targetKey] || { sessionTag: `Week ${code.charAt(1).toUpperCase()} - Session ${code.charAt(3).toUpperCase()}` };

                        const legacyEntry = {
                            id: Date.now() - (5000000 - index * 10000),
                            timestamp: derivedDate,
                            sessionTag: meta.sessionTag,
                            exerciseName: meta.name || '',
                            weight: group.weight,
                            reps: group.reps,
                            level: group.level
                        };

                        let existingLogs = [];
                        const existingRaw = localStorage.getItem('log_history_' + targetKey);
                        if (existingRaw) {
                            try { existingLogs = JSON.parse(existingRaw); } catch(e) {}
                        }
                        existingLogs.push(legacyEntry);
                        localStorage.setItem('log_history_' + targetKey, JSON.stringify(existingLogs));
                        importedCount++;
                    }
                });

                alert(`Success! Imported and grouped ${importedCount} logged exercise set entries.`);
                loadSession();
                if (document.getElementById('historyContainer').style.display === 'block') {
                    renderHistory();
                }
            } catch (err) {
                alert('Invalid JSON file format. Please check your backup file.');
            }
        };
        if (event.target.files[0]) {
            fileReader.readAsText(event.target.files[0]);
        }
    }

    autoSelectCurrentMonth();
    loadSession();
</script>
</body>
</html>
