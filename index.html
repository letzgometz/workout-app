<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StrengthTrack Pro - Cloud Edition</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --accent: #38bdf8;
            --accent-hover: #0284c7;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border-color: #334155;
            --instructions-bg: #0f172a;
            --success: #10b981;
            --danger: #ef4444;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 15px;
            display: flex;
            justify-content: center;
        }

        .container { width: 100%; max-width: 800px; }

        header {
            text-align: center;
            margin-bottom: 1.5rem;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 1rem;
        }

        h1 { margin: 0 0 0.25rem 0; color: var(--accent); font-size: 1.8rem; }
        p { color: var(--text-muted); margin: 0; font-size: 0.9rem; }

        .auth-container {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            padding: 1.5rem;
            border-radius: 8px;
            max-width: 400px;
            margin: 2rem auto;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .user-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1rem;
            padding: 8px 12px;
            background-color: var(--card-bg);
            border-radius: 6px;
            font-size: 0.85rem;
        }

        .controls-panel {
            display: grid;
            grid-template-columns: 1fr 2fr;
            gap: 10px;
            margin-bottom: 1rem;
        }

        select, input, button {
            padding: 10px 12px;
            border-radius: 6px;
            border: 1px solid var(--border-color);
            background-color: #1e293b;
            color: var(--text-main);
            font-size: 0.95rem;
        }

        /* Completion Bar Styling */
        .completion-bar {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 1rem;
            margin-bottom: 1.5rem;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .completion-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .btn-complete {
            background-color: var(--success);
            color: #0f172a;
            font-weight: bold;
            border: none;
            cursor: pointer;
            padding: 10px 16px;
            border-radius: 6px;
            font-size: 0.95rem;
        }

        .btn-complete:hover { background-color: #059669; color: white; }

        .btn-undo {
            background-color: transparent;
            color: var(--danger);
            border: 1px solid var(--danger);
            padding: 2px 6px;
            font-size: 0.75rem;
            border-radius: 4px;
            cursor: pointer;
            margin-left: 8px;
        }

        .btn-undo:hover {
            background-color: var(--danger);
            color: #ffffff;
        }

        .completed-list {
            background-color: #0f172a;
            border-radius: 6px;
            padding: 8px 12px;
            font-size: 0.85rem;
            max-height: 140px;
            overflow-y: auto;
        }

        .completed-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 6px 0;
            border-bottom: 1px dashed #334155;
            color: var(--text-muted);
        }

        .completed-item:last-child { border-bottom: none; }

        .section-header {
            margin: 1.5rem 0 0.75rem 0;
            padding-bottom: 0.25rem;
            border-bottom: 2px solid var(--border-color);
            color: var(--accent);
            font-size: 1.1rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .card {
            background-color: var(--card-bg);
            border-radius: 8px;
            padding: 1.2rem;
            margin-bottom: 1rem;
            border: 1px solid var(--border-color);
        }

        .exercise-title {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 0.5rem;
        }

        .exercise-title h3 { margin: 0; font-size: 1.1rem; color: #ffffff; }

        .badge {
            background-color: #334155;
            color: var(--accent);
            font-size: 0.75rem;
            padding: 3px 8px;
            border-radius: 4px;
            text-transform: uppercase;
            font-weight: bold;
        }

        .badge.warmup { color: #f59e0b; }
        .badge.flexibility { color: #10b981; }

        .target-text {
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-bottom: 8px;
        }

        details {
            background-color: var(--instructions-bg);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            padding: 8px 12px;
            margin-bottom: 12px;
            font-size: 0.85rem;
        }

        summary {
            cursor: pointer;
            color: var(--accent);
            font-weight: 600;
            outline: none;
        }

        details p {
            margin: 8px 0 0 0;
            color: #cbd5e1;
            line-height: 1.4;
        }

        .inputs-row {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr auto;
            gap: 8px;
            margin-bottom: 10px;
        }

        .inputs-row input {
            background-color: #0f172a;
            width: 100%;
            box-sizing: border-box;
            text-align: center;
        }

        button.btn-log, button.btn-action {
            background-color: var(--accent);
            color: #0f172a;
            font-weight: bold;
            border: none;
            cursor: pointer;
        }

        button.btn-log:hover, button.btn-action:hover { background-color: var(--accent-hover); color: white; }

        .history-box {
            background-color: #0f172a;
            padding: 8px 12px;
            border-radius: 6px;
            font-size: 0.85rem;
            color: var(--text-muted);
        }

        .history-item {
            display: flex;
            justify-content: space-between;
            padding: 4px 0;
            border-bottom: 1px dashed #334155;
        }

        .history-item:last-child { border-bottom: none; }
        .cycle-tag { font-size: 0.75rem; color: var(--accent); }
        .hidden { display: none !important; }

        @media (max-width: 500px) {
            .controls-panel { grid-template-columns: 1fr; }
            .completion-header { flex-direction: column; gap: 8px; align-items: stretch; }
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>StrengthTrack Pro</h1>
        <p>Custom Gym Blueprint & Cloud Tracker</p>
    </header>

    <!-- Authentication Form -->
    <div id="authPanel" class="auth-container">
        <h2 style="margin:0 0 10px 0; font-size: 1.2rem; text-align: center;">Sign In / Register</h2>
        <input type="email" id="authEmail" placeholder="Email Address">
        <input type="password" id="authPassword" placeholder="Password">
        <button class="btn-action" onclick="handleAuth('login')">Log In</button>
        <button style="background-color: transparent; color: var(--text-muted); border: 1px solid var(--border-color); cursor:pointer;" onclick="handleAuth('signup')">Create Account</button>
        <p id="authError" style="color: #ef4444; font-size: 0.8rem; text-align: center;"></p>
    </div>

    <!-- Main Workout App -->
    <div id="appPanel" class="hidden">
        <div class="user-bar">
            <span>Logged in as: <strong id="userEmailTag" style="color: var(--accent);"></strong></span>
            <button onclick="handleLogout()" style="padding: 4px 8px; font-size: 0.8rem; cursor:pointer;">Log Out</button>
        </div>

        <div class="controls-panel">
            <div>
                <select id="cycleSelect" onchange="loadSession()">
                    <option value="Cycle 1">Cycle 1 (Month 1)</option>
                    <option value="Cycle 2">Cycle 2 (Month 2)</option>
                    <option value="Cycle 3">Cycle 3 (Month 3)</option>
                    <option value="Cycle 4">Cycle 4 (Month 4)</option>
                    <option value="Cycle 5">Cycle 5 (Month 5)</option>
                    <option value="Cycle 6">Cycle 6 (Month 6)</option>
                </select>
            </div>
            <div>
                <select id="sessionSelect" onchange="loadSession()">
                    <optgroup label="Week 1: Foundation & Hypertrophy">
                        <option value="w1sa">Week 1 - Session A (Push / Overhead Press)</option>
                        <option value="w1sb">Week 1 - Session B (Technogym Pull / Arms)</option>
                        <option value="w1sc">Week 1 - Session C (Step Squat / Precor / Core)</option>
                    </optgroup>
                    <optgroup label="Week 2: Free-Weight Focus">
                        <option value="w2sa">Week 2 - Session A (Dumbbell Hypertrophy & Press)</option>
                        <option value="w2sb">Week 2 - Session B (Technogym Row & Core)</option>
                        <option value="w2sc">Week 2 - Session C (Precor Leg Press & Step Squat)</option>
                    </optgroup>
                    <optgroup label="Week 3: Cable Athleticism (Precor FTS)">
                        <option value="w3sa">Week 3 - Session A (FTS Overhead Press & Upper)</option>
                        <option value="w3sb">Week 3 - Session B (FTS Core & Technogym Lat)</option>
                        <option value="w3sc">Week 3 - Session C (Unilateral Lower & Step Squats)</option>
                    </optgroup>
                    <optgroup label="Week 4: Metabolic Intensity">
                        <option value="w4sa">Week 4 - Session A (Technogym Press & Core Density)</option>
                        <option value="w4sb">Week 4 - Session B (Technogym Pull & Overhead Press)</option>
                        <option value="w4sc">Week 4 - Session C (Step Squat & Full Body Burnout)</option>
                    </optgroup>
                </select>
            </div>
        </div>

        <!-- Workout Completion Tracker Bar -->
        <div class="completion-bar">
            <div class="completion-header">
                <span style="font-weight: 600; font-size: 0.95rem; color: var(--text-main);">Session Log Tracker</span>
                <button class="btn-complete" onclick="markWorkoutCompleted()">✓ Mark Workout Completed Today</button>
            </div>
            <div class="completed-list" id="completedHistoryList">
                <div style="color: #64748b;">No completed sessions recorded yet.</div>
            </div>
        </div>

        <div id="workoutContainer"></div>
    </div>
</div>

        const email = document.getElementById('authEmail').value.trim();
        const password = document.getElementById('authPassword').value;
        const errTag = document.getElementById('authError');
        errTag.textContent = '';

        if (!email || !password) {
            errTag.textContent = 'Please enter both email and password.';
            return;
        }

        if (type === 'signup') {
            auth.createUserWithEmailAndPassword(email, password)
                .catch(err => { errTag.textContent = err.message; });
        } else {
            auth.signInWithEmailAndPassword(email, password)
                .catch(err => { errTag.textContent = err.message; });
        }
    }

    function handleLogout() {
        auth.signOut();
    }

    function syncUserData() {
        if (!currentUser) return;
        db.collection('users').doc(currentUser.uid).onSnapshot(doc => {
            if (doc.exists) {
                const data = doc.data();
                userLogs = data.logs || {};
                completedWorkouts = data.completedWorkouts || [];
            } else {
                userLogs = {};
                completedWorkouts = [];
            }
            renderCompletionHistory();
            loadSession();
        }, err => {
            console.error("Firestore sync error:", err);
        });
    }

    function markWorkoutCompleted() {
        if (!currentUser) return;

        const cycle = document.getElementById('cycleSelect').value;
        const sessionSelect = document.getElementById('sessionSelect');
        const sessionName = sessionSelect.options[sessionSelect.selectedIndex].text;
        
        const now = new Date();
        const dateStr = now.toLocaleDateString(undefined, { weekday: 'short', month: 'short', day: 'numeric', year: 'numeric' });
        const timeStr = now.toLocaleTimeString(undefined, { hour: '2-digit', minute: '2-digit' });

        const entry = {
            id: Date.now(), // unique timestamp ID for precise deletion
            cycle: cycle,
            session: sessionName,
            timestamp: `${dateStr} @ ${timeStr}`
        };

        completedWorkouts.unshift(entry);

        db.collection('users').doc(currentUser.uid).set({
            completedWorkouts: completedWorkouts
        }, { merge: true }).then(() => {
            renderCompletionHistory();
        });
    }

    function undoWorkoutCompleted(entryId) {
        if (!currentUser) return;

        // Filter out the entry with the matching ID
        completedWorkouts = completedWorkouts.filter(item => item.id !== entryId);

        db.collection('users').doc(currentUser.uid).set({
            completedWorkouts: completedWorkouts
        }, { merge: true }).then(() => {
            renderCompletionHistory();
        });
    }

    function renderCompletionHistory() {
        const listDiv = document.getElementById('completedHistoryList');
        if (!completedWorkouts || completedWorkouts.length === 0) {
            listDiv.innerHTML = '<div style="color: #64748b;">No completed sessions recorded yet.</div>';
            return;
        }

        listDiv.innerHTML = completedWorkouts.map(item => `
            <div class="completed-item">
                <span><strong style="color: var(--accent);">[${item.cycle}]</strong> ${item.session}</span>
                <div>
                    <span style="font-weight: 500; color: var(--success);">${item.timestamp}</span>
                    <button class="btn-undo" onclick="undoWorkoutCompleted(${item.id})">Undo</button>
                </div>
            </div>
        `).join('');
    }

    function logEntry(exId) {
        if (!currentUser) return;

        const cycle = document.getElementById('cycleSelect').value;
        const weight = document.getElementById(`w_${exId}`).value || '0';
        const level = document.getElementById(`l_${exId}`).value || 'N/A';
        const reps = document.getElementById(`r_${exId}`).value || '0';

        if (!userLogs[exId]) userLogs[exId] = [];

        userLogs[exId].unshift({
            cycle: cycle,
            date: new Date().toLocaleDateString(undefined, { month: 'numeric', day: 'numeric' }),
            weight: weight,
            level: level,
            reps: reps
        });

        db.collection('users').doc(currentUser.uid).set({
            logs: userLogs
        }, { merge: true }).then(() => {
            document.getElementById(`w_${exId}`).value = '';
            document.getElementById(`l_${exId}`).value = '';
            document.getElementById(`r_${exId}`).value = '';
        });
    }

    function renderCard(ex) {
        const history = userLogs[ex.id] || [];
        let historyHtml = history.length > 0 
            ? history.slice(0, 4).map(h => 
                `<div class="history-item">
                    <span><strong class="cycle-tag">[${h.cycle}]</strong> ${h.date}</span>
                    <span>${h.weight} lbs | Lvl: ${h.level} | ${h.reps} reps</span>
                </div>`
              ).join('')
            : '<div style="font-size: 0.8rem; color: #64748b;">No logs recorded yet.</div>';

        const badgeClass = ex.category === 'Warmup' ? 'badge warmup' : ex.category === 'Flexibility' ? 'badge flexibility' : 'badge';

        const inputsHtml = ex.loggable ? `
            <div class="inputs-row">
                <input type="number" id="w_${ex.id}" placeholder="lbs">
                <input type="text" id="l_${ex.id}" placeholder="Level">
                <input type="number" id="r_${ex.id}" placeholder="Reps">
                <button class="btn-log" onclick="logEntry('${ex.id}')">Log</button>
            </div>
            <div class="history-box">
                <strong style="display: block; margin-bottom: 4px;">Progression Log:</strong>
                ${historyHtml}
            </div>` : '';

        const card = document.createElement('div');
        card.className = 'card';
        card.innerHTML = `
            <div class="exercise-title">
                <h3>${ex.name}</h3>
                <span class="${badgeClass}">${ex.category}</span>
            </div>
            <div class="target-text">Target: <strong>${ex.target}</strong></div>
            
            <details>
                <summary>How to perform exercise</summary>
                <p>${ex.instructions}</p>
            </details>
            ${inputsHtml}
        `;
        return card;
    }

    function loadSession() {
        const sessionKey = document.getElementById('sessionSelect').value;
        const mainExercises = workoutBlueprint[sessionKey] || [];
        const container = document.getElementById('workoutContainer');
        container.innerHTML = '';

        // Warmup Section
        const warmupHeader = document.createElement('h2');
        warmupHeader.className = 'section-header';
        warmupHeader.innerText = '1. Warmup & Mobility';
        container.appendChild(warmupHeader);
        WARMUP_BLOCK.forEach(ex => container.appendChild(renderCard(ex)));

        // Main Workout Section
        const mainHeader = document.createElement('h2');
        mainHeader.className = 'section-header';
        mainHeader.innerText = '2. Core & Main Workout';
        container.appendChild(mainHeader);
        mainExercises.forEach(ex => container.appendChild(renderCard(ex)));

        // Cool-Down Section
        const coolHeader = document.createElement('h2');
        coolHeader.className = 'section-header';
        coolHeader.innerText = '3. Flexibility & Cool-Down';
        container.appendChild(coolHeader);
        COOLDOWN_BLOCK.forEach(ex => container.appendChild(renderCard(ex)));
    }
</script>

</body>
</html>
