            --accent: #38bdf8;

            align-items: center;
        }

        .container {

        }

            margin-bottom: 20px;
            border-bottom: 1px solid var(--border);
            padding-bottom: 15px;
        }

            font-size: 1.8rem;
            color: var(--accent);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .sub-header {
            color: var(--text-muted);
            font-size: 0.9rem;
            margin-top: 5px;
            margin-bottom: 12px;
        }

        .header-btn-group {
            display: flex;
            gap: 8px;
            justify-content: center;
            flex-wrap: wrap;
            margin-top: 8px;
        }

        .nav-controls {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 20px;
        }

        select {
            background-color: var(--bg-card);
            color: var(--text-light);

            padding: 10px;
            border-radius: 8px;
            font-size: 0.95rem;
            width: 100%;

            border-radius: 8px;

            font-size: 1.1rem;
            margin-bottom: 15px;
            text-align: center;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

            color: var(--text-light);

            border-radius: 10px;
            padding: 14px;
            margin-bottom: 12px;
        }

        .card-header {

            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 6px;
        }

        .ex-title {
            font-size: 1.05rem;
            font-weight: 600;
            color: #ffffff;
        }

        .ex-cat {
            font-size: 0.75rem;
            background: var(--bg-card-alt);
            color: var(--accent);
            padding: 2px 6px;
            border-radius: 4px;
            text-transform: uppercase;
        }

        .target-tag {
            font-size: 0.85rem;
            color: var(--accent);
            font-weight: 500;
            margin-bottom: 6px;
        }

        .instructions {

            color: var(--text-muted);
            text-transform: uppercase;
            font-weight: 600;
            letter-spacing: 0.5px;

            border-radius: 6px;
            font-size: 0.85rem;
            width: 100%;

            text-align: center;

            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.85rem;
            display: inline-flex;
            align-items: center;

            color: var(--accent);
            border: 1px solid var(--border);

            border-radius: 6px;

        .btn-subtle:hover {

            background-color: #475569;
            color: #ffffff;

            font-size: 1rem;
            margin-top: 15px;
            justify-content: center;
        }

        .btn-undo {
            background-color: var(--danger);

            display: none;
            background-color: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 16px;
            margin-bottom: 20px;
            width: 100%;
            box-sizing: border-box;

            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
            border-bottom: 1px solid var(--border);
            padding-bottom: 8px;

            color: var(--accent);
            font-size: 1.1rem;
        }

        .history-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.85rem;

            padding: 8px 6px;
            border-bottom: 1px solid var(--bg-card-alt);

            font-weight: 600;
            text-transform: uppercase;
            font-size: 0.75rem;

            text-align: center;

</div>

                    "Deadbug abdominal activations (10 per side)"
                ],
                cooldowns: [
                    "Doorway Lat Stretch with Hip Hinge (30s per side)",
                    "Forearm Flexor Wall Palm Stretch (30s per side)",
                    "Cross-Body Shoulder Reach & Triceps Stretch (30s per side)"
                ],
                exercises: [
                    { id: "w4sb1", name: "Single-Arm DB Overhead Press", cat: "Free Weights", target: "3 sets x 10 / side", instructions: "Press one dumbbell overhead keeping opposite hand on hip to maintain trunk stability." },
                    { id: "w4sb2", name: "FTS Single-Arm Cable Row", cat: "Precor FTS", target: "3 sets x 12 / side", instructions: "Set FTS arm at mid-height. Row single cable handle toward hip into lat squeeze." },
                    { id: "w4sb3", name: "DB Concentration Curls", cat: "Free Weights", target: "3 sets x 12 / side", instructions: "Rest elbow inside inner thigh. Curl dumbbell upward to isolate biceps peak." },
                    { id: "w4sb4", name: "Decline Bench Oblique Crunch", cat: "Core", target: "3 sets x 10-12 / side", instructions: "On decline bench, lift hips while twisting knees toward opposite shoulders alternating sides." }
                ]
            },
            sC: {
                title: "Week 4 - Session C: Step Squat & Full Body Burnout",
                warmups: [
                    "20 mins stationary bike, treadmill, or elliptical",
                    "Dynamic hip openers & fire hydrants (10 per side)",
                    "Air squats with 2-second pause at bottom (10 reps)",
                    "Calf bounces & ankle mobility rolls (15 reps)"
                ],
                cooldowns: [
                    "Lizard Lunge Hip Flexor & Groin Stretch (45s per side)",
                    "Seated Wide-Leg Forward Fold (45s hold)",
                    "Standing Quad & Wall Hip Extension Stretch (30s per side)"
                ],
                exercises: [
                    { id: "w4sc1", name: "DB Step Squat Burnout", cat: "Free Weights", target: "3 sets x 12 / leg", instructions: "Continuous step squat reps alternating legs on each step up." },
                    { id: "w4sc2", name: "Precor Leg Press (Heavy)", cat: "Precor", target: "3 sets x 12-15", instructions: "Feet mid-platform on Precor press. Lower controlled to 90 degrees, drive up through heels." },
                    { id: "w4sc3", name: "21s Biceps Curl (Dumbbell)", cat: "Free Weights", target: "3 sets x 21 total", instructions: "7 reps lower-half, 7 reps upper-half, followed by 7 full-range curls." },
                    { id: "w4sc4", name: "Plank to Pushup Transitions", cat: "Core", target: "1-2 sets max", instructions: "From elbow plank, press up one hand at a time into full pushup position." }
                ]
            }
        }
    };

    function openDemo(exName) {
        const searchQuery = encodeURIComponent(exName + " exercise demonstration form");
        window.open(`https://www.youtube.com/results?search_query=${searchQuery}`, '_blank');
    }

    function loadSession() {
        const week = document.getElementById('weekSelect').value;
        const session = document.getElementById('sessionSelect').value;
        const currentData = programData[week][session];

        let html = `<div class="section-banner">${currentData.title}</div>`;

        // Session-Specific Warmup Section
        html += `
            <div class="routine-box">
                <div class="routine-title">🔥 Dynamic Warm-Up & Mobility</div>
                <ul class="routine-list">
                    ${currentData.warmups.map(item => `<li>${item}</li>`).join('')}
                </ul>
            </div>
        `;

        // Exercise List
        currentData.exercises.forEach(ex => {
            const savedWt = localStorage.getItem('log_wt_' + ex.id) || '';
            const savedReps = localStorage.getItem('log_reps_' + ex.id) || '';
            const savedLvl = localStorage.getItem('log_lvl_' + ex.id) || '';

            html += `
                <div class="card">
                    <div class="card-header">
                        <span class="ex-title">${ex.name}</span>
                        <div style="display: flex; gap: 6px; align-items: center;">
                            <span class="ex-cat">${ex.cat}</span>
                            <button class="btn-demo" onclick="openDemo('${ex.name}')">🎥 Demo</button>
                        </div>
                    </div>
                    <div class="target-tag">${ex.target}</div>
                    <div class="instructions">${ex.instructions}</div>
                    <div class="log-grid">
                        <div class="input-group">
                            <label>Weight</label>
                            <input type="text" id="input_wt_${ex.id}" placeholder="e.g. 45 lbs" value="${savedWt}">
                        </div>
                        <div class="input-group">
                            <label>Reps</label>
                            <input type="text" id="input_reps_${ex.id}" placeholder="e.g. 10,10,12" value="${savedReps}">
                        </div>
                        <div class="input-group">
                            <label>Level / Pin</label>
                            <input type="text" id="input_lvl_${ex.id}" placeholder="e.g. Lvl 5" value="${savedLvl}">
                        </div>
                        <div class="action-buttons">
                            <button class="btn btn-save" onclick="saveLog('${ex.id}')">Save</button>
                            <button class="btn btn-clear" onclick="clearLog('${ex.id}')" title="Clear inputs">Clear</button>
                        </div>
                    </div>
                </div>
            `;
        });

        // Session-Specific Cooldown Section
        html += `
            <div class="routine-box">
                <div class="routine-title">🧘 Cool-Down & Flexibility Stretches</div>
                <ul class="routine-list">
                    ${currentData.cooldowns.map(item => `<li>${item}</li>`).join('')}
                </ul>
            </div>
        `;

        document.getElementById('exerciseList').innerHTML = html;

        const isComplete = localStorage.getItem('complete_' + week + '_' + session) === 'true';
        updateCompleteButton(isComplete);
    }

    function saveLog(exId) {
        const wt = document.getElementById('input_wt_' + exId).value;
        const reps = document.getElementById('input_reps_' + exId).value;
        const lvl = document.getElementById('input_lvl_' + exId).value;

        localStorage.setItem('log_wt_' + exId, wt);
        localStorage.setItem('log_reps_' + exId, reps);
        localStorage.setItem('log_lvl_' + exId, lvl);

        renderHistory();
        alert('Progress saved!');
    }

    function clearLog(exId) {
        const inputWt = document.getElementById('input_wt_' + exId);
        const inputReps = document.getElementById('input_reps_' + exId);
        const inputLvl = document.getElementById('input_lvl_' + exId);

        if (inputWt) inputWt.value = '';
        if (inputReps) inputReps.value = '';
        if (inputLvl) inputLvl.value = '';

        localStorage.removeItem('log_wt_' + exId);
        localStorage.removeItem('log_reps_' + exId);
        localStorage.removeItem('log_lvl_' + exId);

        renderHistory();
    }

    function clearSingleHistory(exId, exName) {
        if (confirm(`Remove log for "${exName}"?`)) {
            clearLog(exId);
        }
    }

    function toggleSessionComplete() {
        const week = document.getElementById('weekSelect').value;
        const session = document.getElementById('sessionSelect').value;
        const key = 'complete_' + week + '_' + session;
        
        const currentState = localStorage.getItem(key) === 'true';
        localStorage.setItem(key, !currentState);
        
        updateCompleteButton(!currentState);
    }

    function updateCompleteButton(isComplete) {
        const btn = document.getElementById('completeBtn');
        if (isComplete) {
            btn.innerHTML = '↩️ Undo Session Completion';
            btn.className = 'btn btn-complete btn-undo';
        } else {
            btn.innerHTML = '✅ Mark Session Complete';
            btn.className = 'btn btn-complete';
        }
    }

    function toggleHistoryView() {
        const histContainer = document.getElementById('historyContainer');
        if (histContainer.style.display === 'block') {
            histContainer.style.display = 'none';
        } else {
            renderHistory();
            histContainer.style.display = 'block';
        }
    }

    function renderHistory() {
        let historyLogs = [];

        Object.keys(programData).forEach(wKey => {
            Object.keys(programData[wKey]).forEach(sKey => {
                const sessionObj = programData[wKey][sKey];
                sessionObj.exercises.forEach(ex => {
                    const wt = localStorage.getItem('log_wt_' + ex.id);
                    const reps = localStorage.getItem('log_reps_' + ex.id);
                    const lvl = localStorage.getItem('log_lvl_' + ex.id);

                    if (wt || reps || lvl) {
                        historyLogs.push({
                            id: ex.id,
                            session: sessionObj.title,
                            exercise: ex.name,
                            weight: wt || '-',
                            reps: reps || '-',
                            level: lvl || '-'
                        });
                    }
                });
            });
        });

        const historyContent = document.getElementById('historyContent');
        if (historyLogs.length === 0) {
            historyContent.innerHTML = `<div class="empty-history">No logged workouts found yet. Hit "Save" on an exercise to start tracking!</div>`;
            return;
        }

        let tableHtml = `
            <table class="history-table">
                <thead>
                    <tr>
                        <th>Exercise</th>
                        <th>Weight</th>
                        <th>Reps</th>
                        <th>Lvl</th>
                        <th style="width: 24px;"></th>
                    </tr>
                </thead>
                <tbody>
        `;

        let currentSessionBanner = "";
        historyLogs.forEach(log => {
            if (log.session !== currentSessionBanner) {
                currentSessionBanner = log.session;
                tableHtml += `
                    <tr>
                        <td colspan="5" style="background-color: var(--bg-card-alt); font-weight: bold; color: var(--warning); padding: 6px 8px;">
                            ${currentSessionBanner}
                        </td>
                    </tr>
                `;
            }
            tableHtml += `
                <tr>
                    <td>${log.exercise}</td>
                    <td>${log.weight}</td>
                    <td>${log.reps}</td>
                    <td>${log.level}</td>
                    <td>
                        <button class="btn-row-del" onclick="clearSingleHistory('${log.id}', '${log.exercise}')" title="Delete this entry">🗑️</button>
                    </td>
                </tr>
            `;
        });

        tableHtml += `</tbody></table>`;
        historyContent.innerHTML = tableHtml;
    }

    function clearAllHistory() {
        if (confirm("Are you sure you want to delete all saved exercise logs?")) {
            Object.keys(localStorage).forEach(key => {
                if (key.startsWith('log_wt_') || key.startsWith('log_reps_') || key.startsWith('log_lvl_') || key.startsWith('complete_')) {
                    localStorage.removeItem(key);
                }
            });
            loadSession();
            renderHistory();
        }
    }

    /* Data Backup & Restore Functions */
    function exportData() {
        let exportObj = {};
        for (let i = 0; i < localStorage.length; i++) {
            let key = localStorage.key(i);
            if (key.startsWith('log_') || key.startsWith('complete_')) {
                exportObj[key] = localStorage.getItem(key);
            }
        }

        if (Object.keys(exportObj).length === 0) {
            alert('No workout data found to export!');
            return;
        }

        let dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(exportObj, null, 2));
        let downloadAnchor = document.createElement('a');
        downloadAnchor.setAttribute("href", dataStr);
        downloadAnchor.setAttribute("download", "workout_logs_backup.json");
        document.body.appendChild(downloadAnchor);
        downloadAnchor.click();
        downloadAnchor.remove();
    }

    function triggerImport() {
        document.getElementById('importInput').click();
    }

    function importData(event) {
        const fileReader = new FileReader();
        fileReader.onload = function(e) {
            try {
                const importedObj = JSON.parse(e.target.result);
                Object.keys(importedObj).forEach(key => {
                    localStorage.setItem(key, importedObj[key]);
                });
                alert('Workout data imported successfully!');
                loadSession();
                renderHistory();
            } catch (err) {
                alert('Invalid JSON file format.');
            }
        };
        if (event.target.files[0]) {
            fileReader.readAsText(event.target.files[0]);
        }
    }

    loadSession();
</script>
</body>
</html>
